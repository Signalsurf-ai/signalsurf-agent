interface:
  display_name: "SignalSurf"
  short_description: "Use your Agent and GTM workspace"
  icon_small: "assets/icon.svg"
  icon_large: "assets/icon.svg"
  brand_color: "#1E1E1E"
  default_prompt: "Use $signalsurf to show my Workspace context, Memory summary, active Projects, and available product routes without changing data."

dependencies:
  tools:
    - type: "mcp"
      value: "signalsurf"
      description: "SignalSurf Workspace and Project context, Memory, Skills, and product tools"
      transport: "streamable_http"
      url: "https://mcp.signalsurf.ai/mcp"

policy:
  allow_implicit_invocation: true
